<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Civic Engagement Portal</h1>
    <nav>
      <ul class="menu">
        <li><a href="index.html">🏠 Home</a></li>
        <li><a href="citizen-report.html">📌 Report Issue</a></li>
        <li><a href="track-issue.html">🔍 Track Issue</a></li>
        <li><a href="contact.html" class="active">📞 Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="form-section">
      <h2>Contact Us</h2>
      <p class="info">Have questions, suggestions, or feedback? Fill out the form below and our support team will respond soon.</p>
      
      <form class="contact-form">
        <label for="name">Full Name:</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="message">Message:</label>
        <textarea id="message" placeholder="Write your message here..." rows="5" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Civic Engagement Portal | All Rights Reserved</p>
  </footer>
</body>
</html>
