<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Civic Issue Reporting - Tamil Nadu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="geo-utils.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
  <div class="bg-white shadow-xl rounded-2xl p-6 w-full max-w-lg border border-gray-100">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-2xl font-bold text-green-700">
        📝 Report a Civic Issue
      </h1>
      <a href="index.html" class="text-sm text-blue-600 hover:underline">🏠 Home</a>
    </div>

    <!-- Location Permission / Status Warning -->
    <div id="locationWarning" class="hidden mb-4 p-3 bg-amber-50 border border-amber-200 text-amber-800 rounded-lg text-sm text-center">
      ⚠️ Location access is needed. Please allow location access or choose a location below.
    </div>

    <!-- Issue Form -->
    <form id="issueForm" class="space-y-4">
      <!-- Category -->
      <div>
        <label class="block font-medium mb-1 text-gray-700">Category *</label>
        <select id="category" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-green-500 focus:outline-none" required onchange="checkNearbyReports()">
          <option value="">-- Select Category --</option>
          <option value="garbage">Garbage / Waste Dump</option>
          <option value="drainage">Drainage Overflow / Leakage</option>
          <option value="streetlight">Street Light Outage</option>
          <option value="road">Road / Pothole Damage</option>
          <option value="other">Other Civic Issue</option>
        </select>
      </div>

      <!-- Description -->
      <div>
        <label class="block font-medium mb-1 text-gray-700">Description *</label>
        <textarea id="description" rows="3" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-green-500 focus:outline-none" placeholder="Describe the problem in detail (e.g. large pothole near street corner)..." required></textarea>
      </div>

      <!-- File Upload -->
      <div>
        <label class="block font-medium mb-1 text-gray-700">Upload Photo / Video *</label>
        <input type="file" id="media" accept="image/*,video/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100 cursor-pointer" required />
        <div id="preview" class="mt-2"></div>
      </div>

      <!-- Location Options -->
      <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
        <div class="flex items-center justify-between mb-2">
          <label class="block font-medium text-gray-700 text-sm">Location Selection</label>
          <button type="button" onclick="getLocation()" class="text-xs bg-blue-600 text-white px-2.5 py-1 rounded hover:bg-blue-700 transition">
            📡 Get GPS
          </button>
        </div>


        <!-- Address -->
        <div class="mb-2">
          <label class="block text-xs text-gray-500 mb-1">Detected Address</label>
          <input type="text" id="address" class="w-full border border-gray-300 rounded p-2 text-sm bg-white" placeholder="Address will auto-fill or enter manually..." />
        </div>

        <!-- Coordinates -->
        <div>
          <label class="block text-xs text-gray-500 mb-1">Coordinates (Lat, Long)</label>
          <input type="text" id="location" class="w-full border border-gray-300 rounded p-2 text-sm bg-white font-mono" placeholder="13.0827, 80.2707" oninput="onManualLocationChange()" />
        </div>
      </div>

      <!-- Proximity / Nearby Complaint Alert Banner -->
      <div id="nearbyAlert" class="hidden p-3 rounded-lg border text-sm transition-all"></div>

      <!-- Submit -->
      <button type="submit" id="submitBtn" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 shadow-md transition disabled:bg-gray-400">
        Submit Civic Report
      </button>
    </form>

    <!-- Confirmation Modal / Card -->
    <div id="confirmation" class="hidden mt-6 p-4 bg-green-50 border border-green-200 rounded-xl text-center">
      <p class="text-green-800 font-bold text-lg">✅ Report Registered Successfully!</p>
      
      <div class="my-3 p-3 bg-white rounded-lg border border-green-200 text-left space-y-1">
        <p class="text-sm text-gray-700">
          Your Personal Tracking ID:
          <span id="trackId" class="font-mono font-bold text-blue-700 text-base"></span>
        </p>
        <p class="text-sm text-gray-700">
          📅 Date & Time:
          <span id="reportDate" class="font-mono text-purple-700"></span>
        </p>
        <div id="clusterNotice" class="text-sm text-amber-800 bg-amber-50 p-2 rounded mt-2 border border-amber-200">
          <!-- Populated dynamically -->
        </div>
      </div>

      <div class="flex justify-center gap-2">
        <button id="copyBtn" class="px-4 py-2 bg-blue-600 text-white text-sm font-semibold rounded hover:bg-blue-700 shadow">
          📋 Copy Tracking ID
        </button>
        <a href="track-issue.html" id="trackLinkBtn" class="px-4 py-2 bg-purple-600 text-white text-sm font-semibold rounded hover:bg-purple-700 shadow">
          🔍 Track This Issue
        </a>
      </div>
      <p id="copyMsg" class="text-xs text-green-700 mt-2 font-semibold hidden">✅ Copied to Clipboard!</p>
    </div>
  </div>

  <script>
    const locationInput = document.getElementById("location");
    const addressInput = document.getElementById("address");
    const warningBox = document.getElementById("locationWarning");
    const submitBtn = document.getElementById("submitBtn");
    const nearbyAlert = document.getElementById("nearbyAlert");
    const categorySelect = document.getElementById("category");

    let locationGranted = false;

    // Set preset coordinates for testing & instant demo
    function setPresetLocation(lat, lon, addr) {
      locationGranted = true;
      locationInput.value = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
      addressInput.value = addr;
      warningBox.classList.add("hidden");
      submitBtn.disabled = false;
      checkNearbyReports();
    }

    function onManualLocationChange() {
      const coords = parseCoords(locationInput.value);
      if (coords) {
        locationGranted = true;
        submitBtn.disabled = false;
        checkNearbyReports();
      }
    }

    // Check if nearby complaints exist for the current category and coordinates
    function checkNearbyReports() {
      const cat = categorySelect.value;
      const coords = parseCoords(locationInput.value);

      if (!cat || !coords) {
        nearbyAlert.classList.add("hidden");
        return;
      }

      // Check active nearby complaints within 100 meters
      const nearby = findNearbyIssues(cat, coords.lat, coords.lon, true, PROXIMITY_THRESHOLD_METERS);

      if (nearby.length > 0) {
        const closest = nearby[0];
        const count = nearby.length;
        nearbyAlert.className = "p-3 rounded-lg border text-sm bg-amber-50 border-amber-300 text-amber-900";
        nearbyAlert.innerHTML = `
          <div class="flex items-start gap-2">
            <span class="text-xl">📍</span>
            <div>
              <p class="font-bold">Notice: Similar Issue Already Reported Nearby!</p>
              <p class="text-xs mt-1 text-amber-800">
                <strong>${count} existing report(s)</strong> found within <strong>~${closest.distanceMeters} meters</strong> of this location (ID: <code>${closest.issue.id}</code>).
              </p>
              <p class="text-xs mt-1 text-green-800 font-medium">
                💡 Submitting your report will <strong>automatically link your complaint</strong> with this location. This increases the urgency level for municipal authorities to resolve it faster!
              </p>
            </div>
          </div>
        `;
        nearbyAlert.classList.remove("hidden");
      } else {
        nearbyAlert.className = "p-2.5 rounded-lg border text-xs bg-green-50 border-green-200 text-green-800";
        nearbyAlert.innerHTML = `✅ No active reports nearby for this category. You will be the primary reporter for this location!`;
        nearbyAlert.classList.remove("hidden");
      }
    }

    // Request GPS Location
    function getLocation() {
      if (navigator.geolocation) {
        warningBox.innerText = "⏳ Fetching GPS coordinates...";
        warningBox.classList.remove("hidden");

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;

            locationGranted = true;
            warningBox.classList.add("hidden");
            submitBtn.disabled = false;

            locationInput.value = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;

            // Reverse geocode address via Nominatim
            fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`)
              .then(response => response.json())
              .then(data => {
                addressInput.value = data.display_name || "Address not found";
                checkNearbyReports();
              })
              .catch(() => {
                addressInput.value = "Current GPS Location";
                checkNearbyReports();
              });
          },
          (error) => {
            warningBox.classList.remove("hidden");
            if (error.code === error.PERMISSION_DENIED) {
              warningBox.innerHTML = "⚠️ Location permission denied. Please click <strong>'Get GPS'</strong> or type your address/coordinates.";
            } else {
              warningBox.innerHTML = "⚠️ Unable to detect GPS automatically. Please click <strong>'Get GPS'</strong> or type your location.";
            }
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      } else {
        warningBox.classList.remove("hidden");
        warningBox.innerText = "⚠️ Geolocation not supported by this browser. Please enter your location manually.";
      }
    }

    window.onload = function() {
      getLocation();
    };

    // Media Preview
    document.getElementById("media").addEventListener("change", function () {
      const preview = document.getElementById("preview");
      preview.innerHTML = "";
      const file = this.files[0];
      if (file) {
        if (file.type.startsWith("image/")) {
          const img = document.createElement("img");
          img.src = URL.createObjectURL(file);
          img.className = "h-32 mt-2 rounded border border-gray-300 object-cover";
          preview.appendChild(img);
        } else if (file.type.startsWith("video/")) {
          const video = document.createElement("video");
          video.src = URL.createObjectURL(file);
          video.controls = true;
          video.className = "h-32 mt-2 rounded border border-gray-300";
          preview.appendChild(video);
        }
      }
    });

    // Submit Form
    document.getElementById("issueForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const coords = parseCoords(locationInput.value);
      if (!coords) {
        alert("Please provide valid location coordinates (e.g. use GPS or Quick Location Presets).");
        return;
      }

      const category = categorySelect.value;
      const description = document.getElementById("description").value;
      const location = locationInput.value;
      const address = addressInput.value || "Near Coordinates " + location;
      const mediaInput = document.getElementById("media").files[0];

      if (!mediaInput) {
        alert("Please upload a photo or video before submitting.");
        return;
      }

      // Read Photo to Base64
      const reader = new FileReader();
      reader.onload = function(event) {
        const base64Photo = event.target.result;

        // Generate unique Citizen Tracking ID
        const trackId = "REP" + Math.floor(100000 + Math.random() * 900000);
        const reportDate = new Date().toLocaleString();

        // Check for existing nearby cluster/complaints to link
        const nearby = findNearbyIssues(category, coords.lat, coords.lon, true, PROXIMITY_THRESHOLD_METERS);
        let clusterId = null;
        let isLinked = false;

        if (nearby.length > 0) {
          isLinked = true;
          clusterId = nearby[0].issue.clusterId || ("CLS-" + nearby[0].issue.id);
        } else {
          clusterId = "CLS-" + trackId;
        }

        // Save issue to localStorage
        const issueData = {
          id: trackId,
          clusterId: clusterId,
          category: category,
          description: description,
          location: location,
          address: address,
          date: reportDate,
          status: "Pending", // Initial status is Pending
          beforePhoto: base64Photo,
          afterPhoto: null
        };

        localStorage.setItem(trackId, JSON.stringify(issueData));

        // Display confirmation
        document.getElementById("confirmation").classList.remove("hidden");
        document.getElementById("trackId").innerText = trackId;
        document.getElementById("reportDate").innerText = reportDate;
        
        const clusterNotice = document.getElementById("clusterNotice");
        if (isLinked) {
          const totalLinked = nearby.length + 1;
          clusterNotice.innerHTML = `
            <strong>📍 Location Match:</strong> Your complaint is linked with <strong>${nearby.length} other citizen report(s)</strong> in your neighborhood.<br/>
            Government Priority: <span class="font-bold text-red-600">ELEVATED (${totalLinked} Neighborhood Reports)</span>. Authorities will treat this as a single consolidated priority!
          `;
        } else {
          clusterNotice.innerHTML = `
            <strong>📍 First Report:</strong> You are the first citizen to report this issue in your immediate area. Your complaint ID is registered for municipal review.
          `;
        }

        // Reset form
        document.getElementById("issueForm").reset();
        document.getElementById("preview").innerHTML = "";
        nearbyAlert.classList.add("hidden");
      };

      reader.readAsDataURL(mediaInput);
    });

    // Copy Tracking ID
    document.getElementById("copyBtn").addEventListener("click", function () {
      const trackId = document.getElementById("trackId").innerText;
      navigator.clipboard.writeText(trackId).then(() => {
        document.getElementById("copyMsg").classList.remove("hidden");
        setTimeout(() => {
          document.getElementById("copyMsg").classList.add("hidden");
        }, 2000);
      });
    });
  </script>
</body>
</html>
