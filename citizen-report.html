<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Civic Issue Reporting</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white shadow-xl rounded-2xl p-6 w-full max-w-lg">
    <h1 class="text-2xl font-bold text-green-700 mb-4 text-center">
      📝 Report an Issue
    </h1>

    <!-- Location Permission Warning -->
    <div id="locationWarning" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-center">
      ⚠️ Location access is required. Please enable location permission and select <strong>"Allow while using the app"</strong>.
    </div>

    <!-- Issue Form -->
    <form id="issueForm" class="space-y-4">
      <!-- Category -->
      <div>
        <label class="block font-medium mb-1">Category</label>
        <select id="category" class="w-full border rounded-lg p-2" required>
          <option value="">-- Select Category --</option>
          <option value="garbage">Garbage / Waste</option>
          <option value="drainage">Drainage</option>
          <option value="streetlight">Street Light</option>
          <option value="road">Road / Pothole</option>
          <option value="other">Other</option>
        </select>
      </div>

      <!-- Description -->
      <div>
        <label class="block font-medium mb-1">Description</label>
        <textarea id="description" rows="3" class="w-full border rounded-lg p-2" required></textarea>
      </div>

      <!-- File Upload -->
      <div>
        <label class="block font-medium mb-1">Upload Photo</label>
        <input type="file" id="media" accept="image/*,video/*" class="w-full" />
        <div id="preview" class="mt-2"></div>
      </div>

      <!-- Address -->
      <div>
        <label class="block font-medium mb-1">Address</label>
        <input type="text" id="address" readonly class="w-full border rounded-lg p-2 bg-gray-100" placeholder="Fetching address..." />
      </div>

      <!-- Location -->
      <div>
        <label class="block font-medium mb-1">Location (Lat, Long)</label>
        <input type="text" id="location" readonly class="w-full border rounded-lg p-2 bg-gray-100" placeholder="Fetching GPS..." />
      </div>

      <!-- Submit -->
      <button type="submit" id="submitBtn" class="w-full bg-green-600 text-white font-bold py-2 rounded-lg hover:bg-green-700">
        Submit Report
      </button>
    </form>

    <!-- Confirmation -->
    <div id="confirmation" class="hidden mt-6 text-center border-t pt-4">
      <p class="text-green-700 font-semibold">✅ Report Submitted Successfully!</p>
      <p class="text-sm text-gray-600">
        Tracking ID:
        <span id="trackId" class="font-mono font-bold text-blue-700"></span>
      </p>
      <p class="text-sm text-gray-600">
        📅 Date & Time:
        <span id="reportDate" class="font-mono font-bold text-purple-700"></span>
      </p>
      <button id="copyBtn" class="mt-3 px-4 py-2 bg-blue-600 text-white text-sm rounded hover:bg-blue-700">
        📋 Copy Tracking ID
      </button>
      <p id="copyMsg" class="text-xs text-green-600 mt-2 hidden">✅ Copied to Clipboard!</p>

      <!-- Direct link to track page -->
      <p class="mt-3 text-sm">
        🔍 <a href="track-issue.html" class="text-blue-700 underline">Go to Track Issue Page</a>
      </p>
    </div>
  </div>

  <script>
    const locationInput = document.getElementById("location");
    const addressInput = document.getElementById("address");
    const warningBox = document.getElementById("locationWarning");
    const submitBtn = document.getElementById("submitBtn");

    let locationGranted = false;

    // Request Location
    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;

            locationGranted = true;
            warningBox.classList.add("hidden");
            submitBtn.disabled = false;

            // Show coordinates
            locationInput.value = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;

            // Fetch human-readable address
            fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`)
              .then(response => response.json())
              .then(data => {
                addressInput.value = data.display_name || "Address not found";
              })
              .catch(() => {
                addressInput.value = "Unable to fetch address";
              });
          },
          (error) => {
            locationGranted = false;
            submitBtn.disabled = true;
            locationInput.value = "";
            addressInput.value = "";
            warningBox.classList.remove("hidden");

            if (error.code === error.PERMISSION_DENIED) {
              warningBox.innerHTML = "⚠️ Location access denied. Please enable location permission and choose <strong>'Allow while using the app'</strong>.";
            } else {
              warningBox.innerText = "⚠️ Unable to fetch location. Please try again.";
            }
          },
          { enableHighAccuracy: true }
        );
      } else {
        warningBox.classList.remove("hidden");
        warningBox.innerText = "⚠️ Geolocation not supported by this browser.";
        submitBtn.disabled = true;
      }
    }

    // Trigger location fetching on page load
    window.onload = getLocation;

    // Retry fetching location every 5 seconds if denied
    setInterval(() => {
      if (!locationGranted) {
        getLocation();
      }
    }, 5000);

    // Media Preview
    document.getElementById("media").addEventListener("change", function () {
      const preview = document.getElementById("preview");
      preview.innerHTML = "";
      const file = this.files[0];
      if (file) {
        if (file.type.startsWith("image/")) {
          const img = document.createElement("img");
          img.src = URL.createObjectURL(file);
          img.className = "h-32 mt-2 rounded";
          preview.appendChild(img);
        } else if (file.type.startsWith("video/")) {
          const video = document.createElement("video");
          video.src = URL.createObjectURL(file);
          video.controls = true;
          video.className = "h-32 mt-2 rounded";
          preview.appendChild(video);
        }
      }
    });

    // Submit Form
    document.getElementById("issueForm").addEventListener("submit", function (e) {
      e.preventDefault();

      if (!locationGranted) {
        alert("Location permission is required to submit this form. Please enable location.");
        return;
      }

      const category = document.getElementById("category").value;
      const description = document.getElementById("description").value;
      const location = locationInput.value;
      const address = addressInput.value;
      const mediaInput = document.getElementById("media").files[0];

      if (!mediaInput) {
        alert("Please upload a photo or video before submitting.");
        return;
      }

      // Convert photo to Base64
      const reader = new FileReader();
      reader.onload = function(event) {
        const base64Photo = event.target.result; // Base64 image/video

        // Generate Tracking ID
        const trackId = "REP" + Math.floor(Math.random() * 1000000);

        // Current date & time
        const reportDate = new Date().toLocaleString();

        // Save to localStorage
        const issueData = {
          id: trackId,
          category,
          description,
          location,
          address,
          date: reportDate,
          status: "In Progress",
          beforePhoto: base64Photo, // Citizen photo saved here
          afterPhoto: null           // Placeholder for admin photo
        };

        localStorage.setItem(trackId, JSON.stringify(issueData));

        // Show confirmation
        document.getElementById("confirmation").classList.remove("hidden");
        document.getElementById("trackId").innerText = trackId;
        document.getElementById("reportDate").innerText = reportDate;

        // Reset form
        document.getElementById("issueForm").reset();
        document.getElementById("preview").innerHTML = "";
        locationInput.value = "";
        addressInput.value = "";
        locationGranted = false;
      };

      reader.readAsDataURL(mediaInput); // Convert to Base64
    });

    // Copy Tracking ID
    document.getElementById("copyBtn").addEventListener("click", function () {
      const trackId = document.getElementById("trackId").innerText;
      navigator.clipboard.writeText(trackId).then(() => {
        document.getElementById("copyMsg").classList.remove("hidden");
        setTimeout(() => {
          document.getElementById("copyMsg").classList.add("hidden");
        }, 2000);
      });
    });
  </script>
</body>
</html>
